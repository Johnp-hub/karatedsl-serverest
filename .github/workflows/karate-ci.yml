name: Karate API Tests CI

# 1. Disparador: Se ejecuta al hacer push a la rama principal
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 2. Descargar el código del repositorio
    - name: Checkout code
      uses: actions/checkout@v4

    # 3. Configurar el entorno de Java
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'maven' # Optimiza la velocidad guardando las dependencias

    # 4. Ejecutar la suite de Karate
    - name: Run Karate Tests
      run: mvn clean test

    # 5. Guardar los reportes HTML como artefactos si algo falla o pasa
    - name: Upload Karate Reports
      if: always() # Se ejecuta aunque los tests fallen
      uses: actions/upload-artifact@v4
      with:
        name: karate-reports
        path: target/karate-reports/
        retention-days: 7